swagger: "2.0"
info:
  title: Restaurant Management API
  description: A robust REST API built with Go, featuring PostgreSQL integration, structured logging, and Swagger documentation for managing restaurant operations.
  version: "1.0"
host: localhost:8001
basePath: /api/v1
schemes:
  - http
  - https
tags:
  - name: system
    description: System operations
  - name: Auth
    description: Authentication operations
  - name: Users
    description: Operations about users
  - name: Restaurants
    description: Operations about restaurants
  - name: Menus
    description: Operations about menu items
  - name: Orders
    description: Order management operations
  - name: Payments
    description: Payment processing and webhooks
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
paths:
  /healthcheck:
    get:
      tags:
        - system
      summary: API Health Check
      responses:
        "200":
          description: API is healthy
          schema:
            $ref: "#/definitions/MessageResponse"
  /auth/signup:
    post:
      tags:
        - Auth
      summary: User Signup
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/SignupInput"
      responses:
        "201":
          description: Signup accepted
          schema:
            $ref: "#/definitions/MessageResponse"
  /orders:
    post:
      tags:
        - Orders
      summary: Create a new order
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/CreateOrderInput"
      responses:
        "201":
          description: Order created
          schema:
            $ref: "#/definitions/OrderResponse"
    get:
      tags:
        - Orders
      summary: List user's orders
      security:
        - Bearer: []
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: "#/definitions/UserOrdersResponse"
  /payments/initiate:
    post:
      tags:
        - Payments
      summary: Initiate a payment
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/InitiatePaymentRequest"
      responses:
        "200":
          description: Payment initiated
          schema:
            $ref: "#/definitions/InitiatePaymentResponse"
definitions:
  Error:
    type: object
    properties:
      title:
        type: string
      message:
        type: string
  MessageResponse:
    type: object
    properties:
      title:
        type: string
      message:
        type: string
  OrderResponse:
    type: object
    properties:
      id:
        type: string
        format: uuid
      total_amount:
        type: number
      status:
        type: string
  CreateOrderInput:
    type: object
    required:
      - restaurant_id
      - items
    properties:
      restaurant_id:
        type: string
      items:
        type: array
        items:
          $ref: "#/definitions/CreateOrderItemInput"
  CreateOrderItemInput:
    type: object
    properties:
      menu_id:
        type: string
      quantity:
        type: integer
  InitiatePaymentRequest:
    type: object
    required:
      - order_id
      - provider
    properties:
      order_id:
        type: string
      provider:
        type: string
      callback_url:
        type: string
  InitiatePaymentResponse:
    type: object
    properties:
      payment_id:
        type: string
      authorization_url:
        type: string
      reference:
        type: string
  UserOrdersResponse:
    type: object
    properties:
      orders:
        type: array
        items:
          $ref: "#/definitions/OrderResponse"
